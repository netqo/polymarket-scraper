# Enters the same pinned Nix devShell used locally, runs the language
# format/lint/test gates (a formatter diff fails the pipeline), and builds the
# release image with `nix build` -- never `docker build`.
#
# Generated by dev-setup (scaffolding/create-project.sh). The gate steps in the
# quality job are spliced in from scaffolding/github-workflows/gates/<lang>.yml;
# read that directory to compare languages, or see the annotated reference at
# ci-observability/github-actions/ci-template.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Format check (a diff fails the pipeline)
        run: nix develop --command bash -c 'test -z "$(gofmt -l .)"'
      - name: Vet
        run: nix develop --command go vet ./...
      - name: Lint
        run: nix develop --command golangci-lint run
      - name: Test
        run: nix develop --command go test ./...

  image:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Build image from Nix
        run: nix build .#dockerImage
