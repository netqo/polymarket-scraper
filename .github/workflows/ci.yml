# Enters the same pinned Nix devShell used locally, runs the format/lint/test
# gates (a formatter diff fails the pipeline), and builds the release image with
# `nix build` -- never `docker build`.
#
# Based on the dev-setup template, with one deliberate omission: there is no
# magic-nix-cache step. See the note on the setup steps below.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No magic-nix-cache. It was measured on this repository and it cost far
      # more than it saved: 75s of the quality job and 241s of the image job
      # went to its post-run upload, 57% of all CI time, to push paths that had
      # just been fetched from cache.nixos.org back into the Actions cache.
      # Installing the toolchain from upstream takes about 15s, so there was
      # never more than a few seconds available to save in the first place.
      #
      # If a future change starts compiling something genuinely expensive from
      # source, revisit this: the answer would be a cache that holds only that
      # artifact, not the whole toolchain closure.
      - uses: DeterminateSystems/nix-installer-action@main

      - name: Format check (a diff fails the pipeline)
        run: nix develop --command bash -c 'test -z "$(gofmt -l .)"'
      - name: Vet
        run: nix develop --command go vet ./...
      - name: Lint
        run: nix develop --command golangci-lint run
      # -race rather than the template's plain go test: this project runs a
      # goroutine per connection and per shard, and a data race there would
      # corrupt one token's book while every other signal stayed green.
      - name: Test
        run: nix develop --command go test -race ./...

  image:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Build image from Nix
        run: nix build .#dockerImage
